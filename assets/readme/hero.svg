    <text x="64" y="145" fill="#f4f6f8" font-size="62" font-weight="750">supervisor-crew</text>
    <text x="66" y="194" fill="#c5cad3" font-size="25">One objective. Five focused workers.</text>
    <text x="66" y="230" fill="#c5cad3" font-size="25">Reviewable results through shared memory.</text>
