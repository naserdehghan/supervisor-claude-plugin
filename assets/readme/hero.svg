<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">supervisor-crew</title>
  <desc id="desc">A supervisor coordinates five specialized Claude Code workers through shared project memory.</desc>
  <rect width="1200" height="390" rx="28" fill="#111318"/>
  <path d="M0 318H1200" stroke="#2b303a" stroke-width="2"/>
  <path d="M650 65V318M840 65V318M1030 65V318" stroke="#20242c" stroke-width="1"/>
